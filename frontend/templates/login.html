{% extends "base.html" %}
{% block title %}Login &mdash; Scatela{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1>Sign In to Scatela</h1>
    <p class="subtitle" style="margin-bottom: 1.25rem;">
        Guardians and child accounts can sign in below.
    </p>

    <form method="POST" action="{{ url_for('auth_web.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}

        <div class="form-group">
            <label for="identifier">Username or Email</label>
            <input id="identifier" name="identifier" type="text" required autocomplete="username" value="{{ identifier or '' }}">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
    </form>

    <p class="muted" style="margin-top: 1rem; text-align: center;">
        New guardian? <a href="{{ url_for('auth_web.register') }}">Create a guardian account</a>
    </p>
</div>
{% endblock %}
