services:
  # Database 
  postgres:
    image: postgres:17
    container_name: scatela-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  


  #App service
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    
    ports:
      - "5001:5001" # "Host port to access": "Docker listening"
    
    depends_on:
      - postgres




volumes:
  postgres_data:

